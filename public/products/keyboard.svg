<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f1f1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10a37f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#10a37f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#10a37f" flood-opacity="0.15"/>
    </filter>
    <filter id="keyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <ellipse cx="600" cy="360" rx="400" ry="300" fill="url(#glow)"/>

  <!-- Keyboard body - perspective view -->
  <g filter="url(#shadow)" transform="translate(600 320) rotate(-3) translate(-600 -320)">
    <!-- Main chassis -->
    <rect x="260" y="220" width="680" height="260" rx="20" fill="url(#bodyGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Key rows -->
    <g filter="url(#keyShadow)">
      <!-- Row 1 - number row (14 keys) -->
      <rect x="290" y="246" width="36" height="36" rx="6" fill="#333"/>
      <rect x="332" y="246" width="36" height="36" rx="6" fill="#333"/>
      <rect x="374" y="246" width="36" height="36" rx="6" fill="#333"/>
      <rect x="416" y="246" width="36" height="36" rx="6" fill="#333"/>
      <rect x="458" y="246" width="36" height="36" rx="6" fill="#333"/>
      <rect x="500" y="246" width="36" height="36" rx="6" fill="#10a37f"/>
      <rect x="542" y="246" width="36" height="36" rx="6" fill="#333"/>
      <rect x="584" y="246" width="36" height="36" rx="6" fill="#333"/>
      <rect x="626" y="246" width="36" height="36" rx="6" fill="#333"/>
      <rect x="668" y="246" width="36" height="36" rx="6" fill="#333"/>
      <rect x="710" y="246" width="36" height="36" rx="6" fill="#333"/>
      <rect x="752" y="246" width="36" height="36" rx="6" fill="#333"/>
      <rect x="794" y="246" width="36" height="36" rx="6" fill="#333"/>
      <rect x="836" y="246" width="68" height="36" rx="6" fill="#333"/>

      <!-- Row 2 - QWERTY row -->
      <rect x="290" y="290" width="52" height="36" rx="6" fill="#333"/>
      <rect x="348" y="290" width="36" height="36" rx="6" fill="#333"/>
      <rect x="390" y="290" width="36" height="36" rx="6" fill="#333"/>
      <rect x="432" y="290" width="36" height="36" rx="6" fill="#333"/>
      <rect x="474" y="290" width="36" height="36" rx="6" fill="#333"/>
      <rect x="516" y="290" width="36" height="36" rx="6" fill="#333"/>
      <rect x="558" y="290" width="36" height="36" rx="6" fill="#333"/>
      <rect x="600" y="290" width="36" height="36" rx="6" fill="#333"/>
      <rect x="642" y="290" width="36" height="36" rx="6" fill="#333"/>
      <rect x="684" y="290" width="36" height="36" rx="6" fill="#6366f1"/>
      <rect x="726" y="290" width="36" height="36" rx="6" fill="#333"/>
      <rect x="768" y="290" width="36" height="36" rx="6" fill="#333"/>
      <rect x="810" y="290" width="36" height="36" rx="6" fill="#333"/>
      <rect x="852" y="290" width="52" height="36" rx="6" fill="#333"/>

      <!-- Row 3 - home row -->
      <rect x="290" y="334" width="60" height="36" rx="6" fill="#333"/>
      <rect x="356" y="334" width="36" height="36" rx="6" fill="#333"/>
      <rect x="398" y="334" width="36" height="36" rx="6" fill="#333"/>
      <rect x="440" y="334" width="36" height="36" rx="6" fill="#333"/>
      <rect x="482" y="334" width="36" height="36" rx="6" fill="#333"/>
      <rect x="524" y="334" width="36" height="36" rx="6" fill="#333"/>
      <rect x="566" y="334" width="36" height="36" rx="6" fill="#333"/>
      <rect x="608" y="334" width="36" height="36" rx="6" fill="#333"/>
      <rect x="650" y="334" width="36" height="36" rx="6" fill="#333"/>
      <rect x="692" y="334" width="36" height="36" rx="6" fill="#333"/>
      <rect x="734" y="334" width="36" height="36" rx="6" fill="#333"/>
      <rect x="776" y="334" width="36" height="36" rx="6" fill="#333"/>
      <rect x="818" y="334" width="86" height="36" rx="6" fill="#10a37f"/>

      <!-- Row 4 - spacebar row -->
      <rect x="290" y="378" width="78" height="36" rx="6" fill="#333"/>
      <rect x="374" y="378" width="36" height="36" rx="6" fill="#333"/>
      <rect x="416" y="378" width="36" height="36" rx="6" fill="#333"/>
      <rect x="458" y="378" width="200" height="36" rx="6" fill="#2a2a2a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="664" y="378" width="36" height="36" rx="6" fill="#333"/>
      <rect x="706" y="378" width="36" height="36" rx="6" fill="#333"/>
      <rect x="748" y="378" width="36" height="36" rx="6" fill="#333"/>
      <rect x="790" y="378" width="36" height="36" rx="6" fill="#333"/>
      <rect x="832" y="378" width="36" height="36" rx="6" fill="#333"/>
      <rect x="874" y="378" width="30" height="36" rx="6" fill="#333"/>
    </g>

    <!-- Key labels on accent keys -->
    <text x="518" y="270" fill="#fff" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">5</text>
    <text x="702" y="314" fill="#fff" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">P</text>
    <text x="861" y="358" fill="#fff" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle">ENTER</text>

    <!-- RGB glow strip under keyboard -->
    <rect x="300" y="430" width="600" height="3" rx="1.5" fill="url(#glow)" opacity="0.6"/>
    <rect x="350" y="430" width="120" height="3" rx="1.5" fill="#10a37f" opacity="0.4"/>
    <rect x="500" y="430" width="80" height="3" rx="1.5" fill="#6366f1" opacity="0.4"/>
    <rect x="610" y="430" width="100" height="3" rx="1.5" fill="#f59e0b" opacity="0.3"/>
  </g>

  <!-- Floating specs -->
  <g>
    <rect x="120" y="180" width="110" height="36" rx="18" fill="#1a1a1a" stroke="rgba(16,163,127,0.2)" stroke-width="1"/>
    <text x="175" y="203" fill="#10a37f" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Hot-swap</text>

    <rect x="970" y="200" width="110" height="36" rx="18" fill="#1a1a1a" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
    <text x="1025" y="223" fill="#818cf8" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Wireless</text>

    <rect x="980" y="340" width="100" height="36" rx="18" fill="#1a1a1a" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
    <text x="1030" y="363" fill="#fbbf24" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">75% layout</text>
  </g>

  <!-- Sparkles -->
  <circle cx="200" cy="140" r="3" fill="#10a37f" opacity="0.4"/>
  <circle cx="1000" cy="160" r="2.5" fill="#6366f1" opacity="0.35"/>
  <circle cx="150" cy="400" r="3" fill="#fbbf24" opacity="0.25"/>
  <circle cx="1050" cy="450" r="2.5" fill="#10a37f" opacity="0.3"/>

  <!-- Ground shadow -->
  <ellipse cx="600" cy="490" rx="300" ry="16" fill="#10a37f" opacity="0.04"/>

  <!-- Label -->
  <text x="600" y="570" fill="#f7f7f8" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="-0.02em">Mecha K1</text>
  <text x="600" y="600" fill="#8e8e8e" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="400" text-anchor="middle">Premium mechanical keyboard</text>
</svg>
