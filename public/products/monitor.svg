<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12101e"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1a1040"/>
      <stop offset="1" stop-color="#0d0a1a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#6366f1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <ellipse cx="600" cy="350" rx="420" ry="300" fill="url(#glow)"/>

  <!-- Monitor -->
  <g filter="url(#shadow)">
    <!-- Bezel -->
    <rect x="220" y="100" width="760" height="400" rx="16" fill="#1e1e1e" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <!-- Screen -->
    <rect x="234" y="114" width="732" height="370" rx="8" fill="url(#screen)"/>

    <!-- Screen content - code editor mockup -->
    <g opacity="0.9">
      <!-- Title bar -->
      <rect x="248" y="128" width="704" height="24" rx="4" fill="rgba(255,255,255,0.03)"/>
      <circle cx="264" cy="140" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="278" cy="140" r="4" fill="#eab308" opacity="0.7"/>
      <circle cx="292" cy="140" r="4" fill="#10a37f" opacity="0.7"/>
      <text x="600" y="144" fill="#8e8e8e" font-family="monospace" font-size="10" text-anchor="middle">checkout.ts  StackStore</text>

      <!-- Code lines -->
      <text x="268" y="175" fill="#6366f1" font-family="monospace" font-size="11" opacity="0.8">function</text>
      <text x="338" y="175" fill="#f7f7f8" font-family="monospace" font-size="11" opacity="0.7">calculateCartTotal(cart, promo) {</text>

      <text x="288" y="193" fill="#8e8e8e" font-family="monospace" font-size="11" opacity="0.6">const subtotal = getSubtotal(cart);</text>

      <text x="288" y="211" fill="#8e8e8e" font-family="monospace" font-size="11" opacity="0.6">const discount = getDiscount(subtotal, promo);</text>

      <rect x="268" y="222" width="420" height="18" rx="3" fill="rgba(239,68,68,0.08)"/>
      <text x="288" y="235" fill="#ef4444" font-family="monospace" font-size="11" opacity="0.9">return subtotal - discount - discount;</text>
      <text x="696" y="235" fill="#ef4444" font-family="monospace" font-size="9" opacity="0.6">// BUG</text>

      <text x="268" y="253" fill="#8e8e8e" font-family="monospace" font-size="11" opacity="0.5">}</text>

      <!-- Codex fix overlay -->
      <rect x="268" y="270" width="420" height="18" rx="3" fill="rgba(16,163,127,0.08)"/>
      <text x="288" y="283" fill="#10a37f" font-family="monospace" font-size="11" opacity="0.9">return subtotal - discount;</text>
      <text x="696" y="283" fill="#10a37f" font-family="monospace" font-size="9" opacity="0.6">// FIXED</text>

      <!-- Terminal at bottom -->
      <rect x="248" y="320" width="704" height="148" rx="0" fill="rgba(0,0,0,0.3)"/>
      <text x="268" y="345" fill="#10a37f" font-family="monospace" font-size="10" opacity="0.7">$ codex remediate --auto</text>
      <text x="268" y="363" fill="#8e8e8e" font-family="monospace" font-size="10" opacity="0.5">Detecting... error rate 3.0% > 2.0% threshold</text>
      <text x="268" y="381" fill="#8e8e8e" font-family="monospace" font-size="10" opacity="0.5">Analyzing root cause via Codex API...</text>
      <text x="268" y="399" fill="#6366f1" font-family="monospace" font-size="10" opacity="0.6">Patch generated: checkout.ts L19</text>
      <text x="268" y="417" fill="#10a37f" font-family="monospace" font-size="10" opacity="0.7"> PR merged. Checkout healed.</text>
    </g>

    <!-- Stand -->
    <rect x="560" y="500" width="80" height="60" rx="4" fill="#1a1a1a"/>
    <rect x="500" y="552" width="200" height="12" rx="6" fill="#1a1a1a"/>
  </g>

  <!-- Floating specs -->
  <g>
    <rect x="100" y="170" width="90" height="36" rx="18" fill="#1a1a1a" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
    <text x="145" y="193" fill="#818cf8" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">4K UW</text>

    <rect x="1010" y="200" width="90" height="36" rx="18" fill="#1a1a1a" stroke="rgba(16,163,127,0.2)" stroke-width="1"/>
    <text x="1055" y="223" fill="#10a37f" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">165 Hz</text>

    <rect x="1000" y="380" width="100" height="36" rx="18" fill="#1a1a1a" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
    <text x="1050" y="403" fill="#fbbf24" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">HDR 600</text>
  </g>

  <!-- Sparkles -->
  <circle cx="160" cy="130" r="3" fill="#6366f1" opacity="0.35"/>
  <circle cx="1060" cy="150" r="2.5" fill="#10a37f" opacity="0.3"/>
  <circle cx="130" cy="450" r="3" fill="#fbbf24" opacity="0.2"/>

  <!-- Label -->
  <text x="600" y="620" fill="#f7f7f8" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="-0.02em">ArcView 34&quot;</text>
  <text x="600" y="650" fill="#8e8e8e" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="400" text-anchor="middle">Ultrawide curved 4K display</text>
</svg>
