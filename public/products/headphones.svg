<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1408"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cupGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#333"/>
      <stop offset="1" stop-color="#222"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#f59e0b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <ellipse cx="600" cy="360" rx="380" ry="300" fill="url(#glow)"/>

  <!-- Headphones -->
  <g filter="url(#shadow)">
    <!-- Headband -->
    <path d="M400 280 Q400 130 600 120 Q800 130 800 280" stroke="#333" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- Headband inner padding -->
    <path d="M430 270 Q430 160 600 150 Q770 160 770 270" stroke="#444" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Headband accent stripe -->
    <path d="M520 143 Q600 135 680 143" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Left ear cup -->
    <ellipse cx="400" cy="340" rx="80" ry="100" fill="url(#cupGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <!-- Left ear pad -->
    <ellipse cx="400" cy="340" rx="60" ry="78" fill="url(#padGrad)"/>
    <!-- Left ear pad inner (mesh) -->
    <ellipse cx="400" cy="340" rx="42" ry="58" fill="#1a1a1a" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <!-- Left ANC indicator -->
    <circle cx="400" cy="340" r="8" fill="#f59e0b" opacity="0.3"/>
    <circle cx="400" cy="340" r="4" fill="#f59e0b" opacity="0.6"/>
    <!-- Left cup detail ring -->
    <ellipse cx="400" cy="340" rx="72" ry="90" fill="none" stroke="rgba(245,158,11,0.1)" stroke-width="1"/>

    <!-- Right ear cup -->
    <ellipse cx="800" cy="340" rx="80" ry="100" fill="url(#cupGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <!-- Right ear pad -->
    <ellipse cx="800" cy="340" rx="60" ry="78" fill="url(#padGrad)"/>
    <!-- Right ear pad inner -->
    <ellipse cx="800" cy="340" rx="42" ry="58" fill="#1a1a1a" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <!-- Right ANC indicator -->
    <circle cx="800" cy="340" r="8" fill="#f59e0b" opacity="0.3"/>
    <circle cx="800" cy="340" r="4" fill="#f59e0b" opacity="0.6"/>
    <!-- Right cup detail ring -->
    <ellipse cx="800" cy="340" rx="72" ry="90" fill="none" stroke="rgba(245,158,11,0.1)" stroke-width="1"/>

    <!-- Adjustable sliders -->
    <rect x="386" y="260" width="28" height="50" rx="8" fill="#2a2a2a" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <rect x="786" y="260" width="28" height="50" rx="8" fill="#2a2a2a" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </g>

  <!-- Sound wave visualization -->
  <g opacity="0.3">
    <!-- Waves from left cup -->
    <path d="M310 300 Q280 340 310 380" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M290 280 Q250 340 290 400" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.3"/>
    <path d="M270 265 Q220 340 270 415" stroke="#f59e0b" stroke-width="1" fill="none" opacity="0.2"/>

    <!-- Waves from right cup -->
    <path d="M890 300 Q920 340 890 380" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M910 280 Q950 340 910 400" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.3"/>
    <path d="M930 265 Q980 340 930 415" stroke="#f59e0b" stroke-width="1" fill="none" opacity="0.2"/>
  </g>

  <!-- ANC cancel icon -->
  <g transform="translate(600, 340)">
    <circle r="28" fill="#1a1a1a" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
    <text y="5" fill="#fbbf24" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" text-anchor="middle">ANC</text>
  </g>

  <!-- Floating specs -->
  <g>
    <rect x="130" y="170" width="100" height="36" rx="18" fill="#1a1a1a" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
    <text x="180" y="193" fill="#fbbf24" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">40 hr</text>

    <rect x="980" y="180" width="110" height="36" rx="18" fill="#1a1a1a" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
    <text x="1035" y="203" fill="#818cf8" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Spatial</text>

    <rect x="990" y="430" width="110" height="36" rx="18" fill="#1a1a1a" stroke="rgba(16,163,127,0.2)" stroke-width="1"/>
    <text x="1045" y="453" fill="#10a37f" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Multipoint</text>
  </g>

  <!-- Sparkles -->
  <circle cx="180" cy="130" r="3" fill="#fbbf24" opacity="0.35"/>
  <circle cx="1040" cy="140" r="2.5" fill="#6366f1" opacity="0.3"/>
  <circle cx="160" cy="460" r="3" fill="#10a37f" opacity="0.2"/>
  <circle cx="1060" cy="500" r="2" fill="#fbbf24" opacity="0.25"/>

  <!-- Ground shadow -->
  <ellipse cx="600" cy="480" rx="250" ry="12" fill="#f59e0b" opacity="0.03"/>

  <!-- Label -->
  <text x="600" y="560" fill="#f7f7f8" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="-0.02em">SilentPod</text>
  <text x="600" y="590" fill="#8e8e8e" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="400" text-anchor="middle">Active noise-canceling headphones</text>
</svg>
